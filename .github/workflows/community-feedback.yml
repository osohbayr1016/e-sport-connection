name: Community feedback checks

on:
  pull_request:
    branches: [main, sport]
  push:
    branches: [main, sport]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repository-hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject tracked secrets and dependencies
        shell: bash
        run: |
          suspect="$(git ls-files | grep -E '(^|/)node_modules/|(^|/)\.env($|\.)|\.(db|sqlite)$' | grep -v -E '(^|/)\.env\.example$' || true)"
          if [ -n "$suspect" ]; then
            echo "::error::Tracked secret or generated files found"
            echo "$suspect"
            exit 1
          fi
  worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test feedback API
        working-directory: community-worker
        run: npm test
      - name: Validate D1 migrations
        working-directory: community-worker
        run: python3 tests/check_migrations.py
      - name: Verify authorization regression guards
        run: node --test security/tests/*.test.mjs
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json
      - name: Install backend
        working-directory: backend
        run: npm ci
      - name: Type-check backend
        working-directory: backend
        run: npm run type-check
      - name: Run backend integration tests
        working-directory: backend
        env:
          MONGOMS_DOWNLOAD_IGNORE_MISSING_HEADER: "true"
        run: npm test -- --runInBand

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend
        working-directory: frontend
        run: npm ci
      - name: Build frontend
        working-directory: frontend
        run: npm run build
      - name: Run frontend Jest tests
        working-directory: frontend
        run: npm test -- --runInBand
