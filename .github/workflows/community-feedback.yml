name: Community feedback checks

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "community-worker/**"
      - "frontend/src/app/feedback/**"
      - "frontend/src/app/api/community/**"
      - "frontend/src/app/page.tsx"
      - "frontend/src/app/components/Navigation.tsx"
      - "frontend/src/app/components/Footer.tsx"
      - "frontend/src/app/components/ServiceState.tsx"
      - "frontend/src/app/players/**"
      - "frontend/src/app/tournaments/**"
      - "frontend/src/lib/communityRead.ts"
      - "frontend/src/app/contexts/AuthContext.tsx"
      - "frontend/src/app/hooks/**"
      - "frontend/jest.config.js"
      - ".github/workflows/community-feedback.yml"
      - "backend/src/controllers/authController.ts"
      - "backend/src/routes/userRoutes.ts"
      - "frontend/src/app/admin-setup/page.tsx"
      - "security/tests/**"
      - "backend/src/routes/newsRoutes.ts"
      - "backend/src/routes/adminAchievementRoutes.ts"
  push:
    branches: [sport]
    paths:
      - "community-worker/**"
      - "frontend/src/app/feedback/**"
      - "frontend/src/app/api/community/**"
      - "frontend/src/app/page.tsx"
      - "frontend/src/app/components/Navigation.tsx"
      - "frontend/src/app/components/Footer.tsx"
      - "frontend/src/app/components/ServiceState.tsx"
      - "frontend/src/app/players/**"
      - "frontend/src/app/tournaments/**"
      - "frontend/src/lib/communityRead.ts"
      - "frontend/src/app/contexts/AuthContext.tsx"
      - "frontend/src/app/hooks/**"
      - "frontend/jest.config.js"
      - ".github/workflows/community-feedback.yml"

permissions:
  contents: read

jobs:
  repository-hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject tracked secrets and dependencies
        shell: bash
        run: |
          suspect="$(git ls-files | grep -E '(^|/)node_modules/|(^|/)\.env($|\.)|\.(db|sqlite)$' | grep -v -E '(^|/)\.env\.example$' || true)"
          if [ -n "$suspect" ]; then
            echo "::error::Tracked secret or generated files found"
            echo "$suspect"
            exit 1
          fi
  worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test feedback API
        working-directory: community-worker
        run: npm test
      - name: Validate D1 migrations
        working-directory: community-worker
        run: python3 tests/check_migrations.py
      - name: Verify authorization regression guards
        run: node --test security/tests/*.test.mjs
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json
      - name: Install backend
        working-directory: backend
        run: npm ci
      - name: Type-check backend
        working-directory: backend
        run: npm run type-check

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend
        working-directory: frontend
        run: npm ci
      - name: Build frontend
        working-directory: frontend
        run: npm run build
      - name: Run frontend Jest tests
        working-directory: frontend
        run: npm test -- --runInBand
