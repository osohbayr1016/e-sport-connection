name: Community feedback checks

on:
  pull_request:
    paths:
      - "community-worker/**"
      - "frontend/src/app/feedback/**"
      - "frontend/src/app/api/community/**"
      - "frontend/src/app/page.tsx"
      - "frontend/src/app/components/Navigation.tsx"
      - ".github/workflows/community-feedback.yml"
  push:
    branches: [sport]
    paths:
      - "community-worker/**"
      - "frontend/src/app/feedback/**"
      - "frontend/src/app/api/community/**"
      - "frontend/src/app/page.tsx"
      - "frontend/src/app/components/Navigation.tsx"
      - ".github/workflows/community-feedback.yml"

jobs:
  worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test feedback API
        working-directory: community-worker
        run: npm test
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend
        working-directory: frontend
        run: npm ci
      - name: Build frontend
        working-directory: frontend
        run: npm run build
      - name: Run frontend Jest tests
        working-directory: frontend
        run: npm test -- --runInBand
